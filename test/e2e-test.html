<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InspectBae E2E Test Lab</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .test-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .test-flex-container {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    #sample-btn {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #3b82f6;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      height: 40px;
      cursor: pointer;
    }
    #sample-badge {
      font-size: 12px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>InspectBae Live Test Suite</h1>
  <div class="test-card" id="card-container">
    <h2>Interactive Card Component</h2>
    <p>Target for real-time CSS testing and custom value modification.</p>
    <div class="test-flex-container" id="flex-row">
      <button id="sample-btn" class="btn btn-primary">Save Changes</button>
      <span id="sample-badge">Active</span>
    </div>
  </div>
  <script src="/dist/content.js"></script>
</body>
</html>
